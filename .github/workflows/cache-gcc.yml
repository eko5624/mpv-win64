name: Cache GCC Toolchain
defaults:
  run:
    shell: D:\msys64\msys2.cmd {0}

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "toolchain"
        required: false
        default: "gcc-mcf-x86_64"
        type: choice
        options:
        - gcc-mcf-x86_64
        - gcc-win32-x86_64
        - gcc-posix-x86_64
        - gcc-mingw64
  #schedule:
  #- cron: '05 0 * * MON'  
 
jobs:
  build:
    runs-on: windows-latest
    steps: 
    - name: Cache msys2
      uses: actions/cache@main
      id: msys2
      with:
        path: D:\msys64
        key: msys2
    
    - name: Cache GCC with the MCF(x86_64) Toolchain
      if: (inputs.toolchain == 'gcc-mcf-x86_64')
      uses: actions/cache@main
      id: gcc-mcf-x86_64
      with:
        path: D:\ucrt64
        key: gcc-mcf-x86_64

    - name: Cache GCC with the MCF(x86_64_v3) Toolchain
      if: (inputs.toolchain == 'gcc-mcf-x86_64')
      uses: actions/cache@main
      id: gcc-mcf-x86_64_v3
      with:
        path: D:\ucrt64
        key: gcc-mcf-x86_64_v3

    - name: Cache GCC with the Win32(x86_64) Toolchain
      if: (inputs.toolchain == 'gcc-win32-x86_64')
      uses: actions/cache@main
      id: gcc-win32-x86_64
      with:
        path: D:\ucrt64
        key: gcc-win32-x86_64

    - name: Cache GCC with the Win32(x86_64_v3) Toolchain
      if: (inputs.toolchain == 'gcc-win32-x86_64')
      uses: actions/cache@main
      id: gcc-win32-x86_64_v3
      with:
        path: D:\ucrt64
        key: gcc-win32-x86_64_v3

    - name: Cache GCC with the Posix(x86_64) Toolchain
      if: (inputs.toolchain == 'gcc-posix-x86_64')
      uses: actions/cache@main
      id: gcc-posix-x86_64
      with:
        path: D:\ucrt64
        key: gcc-posix-x86_64

    - name: Cache GCC with the Posix(x86_64_v3) Toolchain
      if: (inputs.toolchain == 'gcc-posix-x86_64')
      uses: actions/cache@main
      id: gcc-posix-x86_64_v3
      with:
        path: D:\ucrt64
        key: gcc-posix-x86_64_v3

    - name: Cache MinGW-w64-GCC Toolchain
      if: (inputs.toolchain == 'gcc-mingw64')
      uses: actions/cache@main
      id: gcc-mingw64
      with:
        path: D:\ucrt64
        key: gcc-mingw64
    
    - name: Install msys2
      if: (inputs.toolchain == 'gcc-mcf-x86_64' || inputs.toolchain == 'gcc-mcf-x86_64_v3' || inputs.toolchain == 'gcc-win32-x86_64' || inputs.toolchain == 'gcc-win32-x86_64_v3' || inputs.toolchain == 'gcc-posix-x86_64' || inputs.toolchain == 'gcc-posix-x86_64_v3') && (steps.msys2.outputs.cache-hit != 'true')
      uses: msys2/setup-msys2@v2
      with:
        cache: false
        location: D:\
        install: base-devel autotools git p7zip

    - name: Install MinGW-w64-GCC Toolchain
      if: (steps.gcc-mingw64.outputs.cache-hit != 'true' && inputs.toolchain == 'gcc-mingw64')
      uses: msys2/setup-msys2@v2
      with:
        cache: false
        location: D:\
        install: >-
          base-devel
          autotools
          git
          yasm
          nasm
          p7zip
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-tools-git
          mingw-w64-ucrt-x86_64-meson
          mingw-w64-ucrt-x86_64-make
          mingw-w64-ucrt-x86_64-cmake
          
    - name: Prepare
      run: git config --global core.autocrlf input
      shell: bash
    
    - name: Checkout
      uses: actions/checkout@main

    - name: Config msys2
      if: steps.msys2.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cp msys2-config/msys2.cmd /d/msys64
        install -m644 msys2-config/*.conf /d/msys64/etc/
        install -m755 msys2-config/makepkg-* /d/msys64/usr/bin/
        
    - name: Install GCC With MCF(x86_64) Toolchain
      if: (steps.gcc-mcf-x86_64.outputs.cache-hit != 'true' && inputs.toolchain == 'gcc-mcf-x86_64')
      run: |
        curl -OL https://github.com/eko5624/toolchain/releases/download/toolchain/target-gcc-mcf-latest-ucrt-x86_64.7z
        7z x target-gcc-mcf*.7z -o/d && mv /d/target /d/ucrt64

    - name: Install GCC With Win32(x86_64) Toolchain
      if: (steps.gcc-win32-x86_64.outputs.cache-hit != 'true' && inputs.toolchain == 'gcc-win32-x86_64')
      run: |
        curl -OL https://github.com/eko5624/toolchain/releases/download/toolchain/target-gcc-win32-latest-ucrt-x86_64.7z
        7z x target-gcc-win32*.7z -o/d && mv /d/target /d/ucrt64

    - name: Install GCC With Posix(x86_64) Toolchain
      if: (steps.gcc-posix-x86_64.outputs.cache-hit != 'true' && inputs.toolchain == 'gcc-posix-x86_64')
      run: |
        curl -OL https://github.com/eko5624/toolchain/releases/download/toolchain/target-gcc-posix-latest-ucrt-x86_64.7z
        7z x target-gcc-posix*.7z -o/d && mv /d/target /d/ucrt64

    - name: Install curl
      if: (steps.gcc-mingw64.outputs.cache-hit != 'true' && inputs.toolchain == 'gcc-mingw64')
      run: |
        mv /d/msys64/ucrt64 /d/ucrt64
        curl -L -o curl-win64-mingw.zip 'https://curl.se/windows/latest.cgi?p=win64-mingw.zip'
        7z x curl*.zip
        cp curl*/bin/curl-ca-bundle.crt /d/ucrt64/bin
        cp curl*/bin/curl.exe /d/ucrt64/bin

    - name: Remove *.dll.a from MinGW-w64-GCC Toolchain
      if: (steps.gcc-mingw64.outputs.cache-hit != 'true' && inputs.toolchain == 'gcc-mingw64')
      run: |
        find /d/ucrt64/lib -type f \( -name "*.dll.a" \) -print0 | xargs -0 -I {} rm {}
        find /d/ucrt64/lib -type f -name "*.la" -print0 | xargs -0 -I {} rm {}
