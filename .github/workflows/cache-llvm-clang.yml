name: Cache mstorsjo's Clang Toolchain
defaults:
  run:
    shell: D:\msys64\msys2.cmd {0}

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "toolchain"
        required: false
        default: "clang-llvm-mingw-x86_64"
        type: choice
        options:
        - clang-mingw64-x86_64
        - clang-llvm-mingw-x86_64

  #schedule:
  #- cron: '05 0 * * MON'  
 
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Cache msys2
      uses: actions/cache@main
      id: msys2
      with:
        path: D:\msys64
        key: msys2

    - name: Cache llvm-mingw(x86_64) Toolchain
      if: (inputs.toolchain == 'clang-llvm-mingw-x86_64')
      uses: actions/cache@main
      id: clang-llvm-mingw-x86_64
      with:
        path: D:\ucrt64
        key: clang-llvm-mingw-x86_64

    - name: Cache llvm-mingw(x86_64_v3) Toolchain
      if: (inputs.toolchain == 'clang-llvm-mingw-x86_64')
      uses: actions/cache@main
      id: clang-llvm-mingw-x86_64_v3
      with:
        path: D:\ucrt64
        key: clang-llvm-mingw-x86_64_v3
    
    - name: Install msys2
      if: (steps.msys2.outputs.cache-hit != 'true' && inputs.toolchain == 'clang-llvm-mingw-x86_64')
      uses: msys2/setup-msys2@v2
      with:
        cache: false
        location: D:\
        install: >-
          base-devel
          autotools
          git
          nasm
          p7zip
          pkgconf
          meson
          cmake

    - name: Prepare
      run: git config --global core.autocrlf input
      shell: bash
    
    - name: Checkout
      uses: actions/checkout@main

    - name: Config msys2
      if: steps.msys2.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cp msys2-config/msys2.cmd /d/msys64
        install -m644 msys2-config/*.conf /d/msys64/etc/
        install -m755 msys2-config/makepkg-* /d/msys64/usr/bin/

    - name: Install llvm-mingw Toolchain
      if: (steps.clang-llvm-mingw-x86_64.outputs.cache-hit != 'true' && inputs.toolchain == 'clang-llvm-mingw-x86_64')
      run: |
        curl -OL https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip
        7z x llvm-mingw*.zip && rm llvm-mingw*.zip
        mv  llvm-mingw* /d/ucrt64

    - name: Install curl
      if: (steps.clang-mingw64-x86_64.outputs.cache-hit != 'true' && inputs.toolchain == 'clang-mingw64-x86_64')
      run: |
        curl -L -o curl-win64-mingw.zip 'https://curl.se/windows/latest.cgi?p=win64-mingw.zip'
        7z x curl*.zip
        cp curl*/bin/curl-ca-bundle.crt /d/ucrt64/bin
        cp curl*/bin/curl.exe /d/ucrt64/bin

    - name: Install GitHub CLI
      if: (steps.clang-mingw64-x86_64.outputs.cache-hit != 'true' && inputs.toolchain == 'clang-mingw64-x86_64')
      run: |
        mv /clang64/bin/gh.exe /d/ucrt64/bin

    - name: Remove "*.dll.a" from MinGW-w64-Clang Toolchain
      if: (steps.clang-mingw64-x86_64.outputs.cache-hit != 'true' && inputs.toolchain == 'clang-mingw64-x86_64')
      run: |
        find /d/ucrt64/lib -type f \( -name "*.dll.a" \) -print0 | xargs -0 -I {} rm {}

